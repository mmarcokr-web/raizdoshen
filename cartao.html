<style>
:root{
  --bg:#1b1f1c; --outer:#efece4; --panel:#4f6b57; --cream:#f5f1e8; --soft:#d9e3d6;
  --btn:#efece4; --btn-text:#2c3a30; --btn-sub:#5b6b5f; --dark:#1b1f1c; --avatar:#e7dcc6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1210; --outer:#222823; --panel:#3f5846; --btn:#e9e5da; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg:#0f1210; --outer:#222823; --panel:#3f5846; --btn:#e9e5da; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--outer);border-radius:36px;padding:22px 22px 34px}
.panel{background:var(--panel);border-radius:30px;padding:36px 22px 56px;text-align:center;position:relative}
.avatar{width:150px;height:150px;border-radius:50%;background:var(--avatar);border:9px solid var(--dark);margin:0 auto 22px;display:block;object-fit:cover}
h1{margin:0 0 8px;font-size:30px;font-weight:700;color:var(--cream)}
.sub{margin:0;font-size:15px;color:var(--soft);line-height:1.6}
.sub.small{font-size:13px;font-weight:300;opacity:.9}
.btns{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;background:var(--btn);border-radius:16px;padding:12px 14px;text-decoration:none;text-align:left}
.btn:active{transform:scale(.98)}
.ic{flex:0 0 40px;height:40px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center}
.ic svg{width:20px;height:20px;fill:none;stroke:#efece4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{display:block;font-size:15px;font-weight:500;color:var(--btn-text)}
.s{display:block;font-size:12.5px;color:var(--btn-sub);overflow-wrap:anywhere}
.cta{position:relative;display:block;width:max-content;max-width:90%;margin:-28px auto 0;background:var(--dark);color:#f5f1e8;text-decoration:none;font-size:15px;font-weight:500;padding:16px 30px;border-radius:18px;text-align:center}
</style>
